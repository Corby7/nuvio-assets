name: Backdrop sync

on:
  schedule:
    # Daily at 04:00 UTC. The job self-skips folders whose source lists have
    # not changed, so a quiet day costs one catalog request per source.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate even if the source lists are unchanged"
        type: boolean
        default: false

# Needed to commit the regenerated backdrops back to this repo.
permissions:
  contents: write

concurrency:
  group: backdrop-sync
  cancel-in-progress: false

jobs:
  regenerate-backdrops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # @napi-rs/canvas ships prebuilt binaries — no cairo/pango/librsvg apt
      # packages and no native build, which was most of this job's old runtime.
      - name: Install script dependencies
        working-directory: scripts/backdrop-sync
        run: npm install

      - name: Run backdrop sync
        id: sync
        working-directory: scripts/backdrop-sync
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          ADDON_BASE_URLS: ${{ secrets.ADDON_BASE_URLS }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          NUVIO_EMAIL: ${{ secrets.NUVIO_EMAIL }}
          NUVIO_PASSWORD: ${{ secrets.NUVIO_PASSWORD }}
          NUVIO_PROFILE_ID: ${{ vars.NUVIO_PROFILE_ID }}
          TARGET_COLLECTION_TITLES: ${{ vars.TARGET_COLLECTION_TITLES }}
          TARGET_FOLDER_TITLES: ${{ vars.TARGET_FOLDER_TITLES }}
          ASSETS_BASE_URL: ${{ vars.ASSETS_BASE_URL }}
          ACCENT_OVERRIDES: ${{ vars.ACCENT_OVERRIDES }}
          ACCENT_OPACITY: ${{ vars.ACCENT_OPACITY }}
          ACCENT_REACH: ${{ vars.ACCENT_REACH }}
          FORCE_REGENERATE: ${{ inputs.force }}
        run: npm start

      # Runs even when the sync step exited non-zero. The script pushes the new
      # heroBackdropUrls to Nuvio *before* it reports per-folder failures, so
      # skipping the commit on a partial failure would leave the app pointing at
      # bytes that were never committed — and the manifest would stay stale, so
      # every later run would repeat the same push and the same failure.
      - name: Commit regenerated backdrops
        id: commit
        if: ${{ !cancelled() && steps.sync.outputs.changed != '0' }}
        run: |
          # Stage first: new folders/groups arrive as untracked files, which
          # `git diff` alone does not report.
          git add -A backdrops
          if git diff --cached --quiet -- backdrops; then
            echo "No file changes to commit."
            echo "committed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Added as well as modified: jsDelivr caches 404s, so a path the app
          # started serving before the file existed needs purging too.
          purge_list=$(git diff --cached --name-only --diff-filter=AM -- 'backdrops/**/*.webp' 'backdrops/*.webp')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh collection backdrops"
          # Any unrelated push to main between checkout and here would otherwise
          # fail the job after the collections were already updated.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
          # Newline-delimited, so a path is never split on whitespace.
          {
            echo "committed<<PURGE_EOF"
            printf '%s\n' "$purge_list"
            echo "PURGE_EOF"
          } >> "$GITHUB_OUTPUT"

      # jsDelivr ignores the query string when caching, so the ?v= hash on
      # heroBackdropUrl only busts the browser cache — the edge would keep
      # serving the old bytes for up to s-maxage (12h). Purging the changed
      # paths is what actually makes an update visible.
      - name: Purge jsDelivr cache
        if: ${{ !cancelled() && steps.commit.outputs.committed != '' }}
        env:
          PURGE_FILES: ${{ steps.commit.outputs.committed }}
        run: |
          printf '%s\n' "$PURGE_FILES" | while IFS= read -r file; do
            [ -n "$file" ] || continue
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}/${file}"
            status=$(curl -s --max-time 30 "$url" | tr -d '\n' | grep -o '"status": *"[^"]*"' | head -1)
            echo "purge ${file}: ${status:-no response}"
          done
